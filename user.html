<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡系统 - 用户端</title>
<meta name="theme-color" content="#1a2b5c">
<!-- PWA 清单：与 service-worker.js / icon.png 同目录，全部相对路径 -->
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   打卡系统 · 用户端 (user.html)
   - 联网：打卡数据提交到电脑后端接口 POST /api/checkin
   - 断网：自动保存到浏览器 IndexedDB（离线缓存数据库）
   - 网络恢复：自动把未同步的离线记录上传到电脑后端
   - 页面提供【本地离线打卡记录】面板，可查看/删除
   - 主题：深蓝主色调；顶部/底部黑白横向条纹；全部相对路径
   ============================================================ */
:root{
  --blue-deep:#1a2b5c;
  --blue-light:#2b4394;
  --blue-dark:#0e1c3d;
  --red:#d93025;
  --ok:#1e8e3e;
  --warn:#b45309;
  --text:#1f2937;
  --muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue-deep) 60%,var(--blue-light) 100%);
  min-height:100vh;padding:24px 0 120px;
}
/* 顶部 / 底部 黑白横向条纹 */
.stripes{
  position:fixed;left:0;right:0;height:24px;z-index:1000;
  background:repeating-linear-gradient(to bottom,#000 0 12px,#fff 12px 24px);
}
.stripes.top{top:0}
.stripes.bottom{bottom:0}
/* 顶栏 */
.topbar{
  position:sticky;top:24px;z-index:900;
  background:var(--blue-dark);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.topbar .brand{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar .brand img{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:13px}
.pill{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.on{background:#14532d;color:#86efac}
.pill.off{background:#7f1d1d;color:#fca5a5}
.topbar button{
  background:rgba(255,255,255,.14);color:#fff;border:none;
  padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;
}
.topbar button:hover{background:rgba(255,255,255,.26)}
/* 内容 */
main{max-width:640px;margin:0 auto;padding:16px}
.card{
  background:rgba(255,255,255,.97);border-radius:14px;
  padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);
}
.card h2{font-size:15px;color:var(--blue-deep);margin-bottom:10px;border-left:4px solid var(--blue-deep);padding-left:8px}
/* 打卡区 */
.now{font-size:14px;color:var(--text);text-align:center;margin-bottom:12px}
.now b{color:var(--blue-deep);font-size:16px}
.big-btn{
  display:block;width:180px;height:180px;margin:6px auto 14px;
  border-radius:50%;border:none;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#e8443a,#c62828);
  color:#fff;font-size:26px;font-weight:700;letter-spacing:4px;
  box-shadow:0 12px 32px rgba(198,40,40,.5);
}
.big-btn:active{transform:scale(.96)}
.big-btn:disabled{background:#9ca3af;box-shadow:none;cursor:not-allowed}
.img-box{text-align:center;margin-bottom:10px}
.img-box img{max-width:220px;max-height:220px;border-radius:10px;border:1px solid #e5e7eb}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--text);margin-bottom:4px}
.field textarea{
  width:100%;padding:9px 11px;font-size:14px;min-height:56px;
  border:1px solid #d1d5db;border-radius:8px;resize:vertical;
}
.field textarea:focus{outline:none;border-color:var(--blue-deep)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{
  padding:9px 18px;font-size:14px;border:none;border-radius:8px;cursor:pointer;
  background:var(--blue-deep);color:#fff;
}
.btn:hover{background:var(--blue-light)}
.btn:disabled{background:#8fa3d8;cursor:not-allowed}
.btn-mini{padding:5px 12px;font-size:12px;border:none;border-radius:6px;cursor:pointer;background:#e5e7eb;color:#374151}
.btn-mini.del{background:#fde8e8;color:#b91c1c}
.msg{font-size:13px;text-align:center;min-height:18px;margin-top:10px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--ok)}
/* 同步状态区 */
.sync-stat{font-size:13px;color:var(--text);margin-bottom:8px}
.sync-stat .pill{margin-left:6px}
/* 离线记录列表 */
.rec{
  border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;
  margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;
}
.rec img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:#f3f4f6}
.rec .info{flex:1;min-width:0}
.rec .time{font-size:13px;color:var(--text);font-weight:600}
.rec .note{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-all}
.rec .meta{font-size:12px;margin-top:5px}
.rec .st{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px}
.rec .st.done{background:#dcfce7;color:#166534}
.rec .st.wait{background:#fef3c7;color:#92400e}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:14px 0}
.foot{font-size:12px;color:#c9d6f0;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="stripes top"></div>
<div class="stripes bottom"></div>

<!-- 顶栏 -->
<header class="topbar">
  <div class="brand">
    <img src="icon.png" alt="打卡系统">
    <span>打卡系统</span>
  </div>
  <div class="right">
    <span class="pill on" id="netPill">在线</span>
    <button type="button" id="logoutBtn">退出</button>
  </div>
</header>

<main>
  <!-- 打卡卡片 -->
  <section class="card">
    <h2>今日打卡</h2>
    <p class="now">当前时间：<b id="clock">--</b></p>
    <button type="button" class="big-btn" id="checkinBtn">打卡</button>
    <div class="img-box" id="imgBox" style="display:none"></div>
    <div class="field">
      <label for="note">备注（可选）</label>
      <textarea id="note" placeholder="填写本次打卡备注，如：劳动/学习/就医…"></textarea>
    </div>
    <div class="row" style="justify-content:center">
      <button type="button" class="btn" id="pickImgBtn">拍照 / 选图</button>
      <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <!-- 离线记录面板 -->
  <section class="card">
    <h2>本地打卡记录（离线缓存）</h2>
    <div class="sync-stat" id="syncStat">
      在线状态：<span class="pill on" id="syncPill">在线</span>
      <span style="margin-left:8px" id="pendingTip">待同步：0 条</span>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button type="button" class="btn" id="syncBtn">立即同步</button>
    </div>
    <div id="recList"><p class="empty">加载中…</p></div>
  </section>
</main>

<p class="foot" id="footNote">服务器：未设置（请先在登录页填写电脑局域网地址）</p>

<script>
/* ============================================================
   【模块一】IndexedDB 离线缓存数据库
   - 库名：checkin_pwa，表：checkins，主键：id
   - 所有打卡记录先写入本地库（离线账本），在线提交成功则标记 synced=true
   ============================================================ */
var DB_NAME = 'checkin_pwa';
var DB_VER = 1;
var STORE = 'checkins';

function openDB() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function (e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) {
        db.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}
/* 写入一条记录 */
function dbAdd(record) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(record);
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror = function () { db.close(); reject(tx.error); };
    });
  });
}
/* 读取全部记录（按时间倒序） */
function dbAll() {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
      req.onsuccess = function () {
        db.close();
        var list = req.result || [];
        list.sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
        resolve(list);
      };
      req.onerror = function () { db.close(); reject(req.error); };
    });
  });
}
/* 标记一条记录已同步 */
function dbMarkSynced(id) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, 'readwrite');
      var store = tx.objectStore(STORE);
      var get = store.get(id);
      get.onsuccess = function () {
        var rec = get.result;
        if (rec) { rec.synced = true; store.put(rec); }
      };
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror = function () { db.close(); reject(tx.error); };
    });
  });
}
/* 删除一条记录 */
function dbDelete(id) {
  return openDB().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = function () { db.close(); resolve(); };
      tx.onerror = function () { db.close(); reject(tx.error); };
    });
  });
}

/* ============================================================
   【模块二】工具函数：服务器地址 / 时间 / 图片压缩 / 请求
   ============================================================ */
function getServer() {
  return (localStorage.getItem('pwa_server') || '').trim().replace(/\/+$/, '');
}
function getUsername() {
  return localStorage.getItem('pwa_user') || '';
}
function nowStr() {
  var d = new Date();
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
/* 图片压缩：最长边 720px，质量 0.7，转 JPEG base64（减小体积便于同步） */
function compressImage(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var MAX = 720;
        var w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
          else { w = Math.round(w * MAX / h); h = MAX; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = function () { reject(new Error('图片读取失败')); };
      img.src = e.target.result;
    };
    reader.onerror = function () { reject(new Error('文件读取失败')); };
    reader.readAsDataURL(file);
  });
}
/* 带超时的请求（8 秒），断网时快速失败 */
function postJSON(url, body) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 8000);
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: ctrl.signal
  }).then(function (res) {
    clearTimeout(timer);
    return res.ok;
  }).catch(function (err) {
    clearTimeout(timer);
    throw err;
  });
}

/* ============================================================
   【模块三】打卡逻辑
   - 联网：提交到电脑后端 POST {server}/api/checkin {record}
   - 断网/失败：记录留在本地库（synced=false），等网络恢复自动同步
   ============================================================ */
function showMsg(text, cls) {
  var el = document.getElementById('msg');
  el.textContent = text || '';
  el.className = 'msg ' + (cls || '');
}
var pickedImage = '';   // 当前已选并压缩好的图片（可选）

/* 拍照/选图 */
document.getElementById('pickImgBtn').addEventListener('click', function () {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', function (e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  compressImage(file).then(function (dataUrl) {
    pickedImage = dataUrl;
    var box = document.getElementById('imgBox');
    box.style.display = 'block';
    box.innerHTML = '<img src="' + dataUrl + '" alt="打卡图片">';
  }).catch(function (err) { showMsg(err.message, 'err'); });
  e.target.value = '';
});

/* 提交单条记录到后端（成功返回 true） */
function submitToServer(server, record) {
  return postJSON(server + '/api/checkin', { record: record });
}

/* 打卡主流程 */
async function doCheckin() {
  var server = getServer();
  if (!server) {
    showMsg('未设置服务器地址：请返回登录页填写电脑局域网地址', 'err');
    return;
  }
  var record = {
    id: 'ck_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
    username: getUsername(),
    time: nowStr(),
    note: document.getElementById('note').value.trim(),
    image: pickedImage,
    synced: false,
    createdAt: Date.now()
  };

  /* 尝试联网提交；失败（断网/超时）也不影响，记录照常入库等待同步 */
  var syncedOk = false;
  try {
    syncedOk = await submitToServer(server, record);
  } catch (e) { syncedOk = false; }
  record.synced = syncedOk;

  await dbAdd(record);              // 全部写入本地离线库（本地账本）
  pickedImage = '';
  document.getElementById('imgBox').style.display = 'none';
  document.getElementById('imgBox').innerHTML = '';
  document.getElementById('note').value = '';
  renderRecords();
  updateNetUI();

  if (syncedOk) { showMsg('打卡成功，已同步到电脑端', 'ok'); }
  else { showMsg('打卡成功（离线保存）：网络恢复后将自动上传', 'ok'); }
}

/* ============================================================
   【模块四】同步模块
   - 触发时机：页面加载 / 网络恢复(online) / 每 30 秒 / 手动点击
   - 逻辑：遍历本地库中 synced=false 的记录，逐条上传，成功后标记
   ============================================================ */
var syncing = false;
async function syncPending() {
  if (syncing) return;
  syncing = true;
  try {
    var server = getServer();
    var list = await dbAll();
    var pending = list.filter(function (r) { return !r.synced; });
    if (pending.length === 0) { renderRecords(); return; }
    if (!server) { showMsg('未设置服务器地址，无法同步', 'err'); return; }

    for (var i = 0; i < pending.length; i++) {
      try {
        var ok = await submitToServer(server, pending[i]);
        if (ok) { await dbMarkSynced(pending[i].id); }
      } catch (e) { break; }        // 网络中断：停止，等待下次触发
    }
  } catch (e) { /* 本地数据库异常：忽略，等待下次触发 */ }
  finally {
    syncing = false;
    renderRecords();
  }
}

/* ============================================================
   【模块五】界面渲染：在线状态 / 待同步数 / 记录列表
   ============================================================ */
function isOnline() { return navigator.onLine; }

function updateNetUI() {
  var on = isOnline();
  var pill = document.getElementById('netPill');
  pill.textContent = on ? '在线' : '离线';
  pill.className = 'pill ' + (on ? 'on' : 'off');
  var pill2 = document.getElementById('syncPill');
  pill2.textContent = on ? '在线' : '离线';
  pill2.className = 'pill ' + (on ? 'on' : 'off');
  document.getElementById('footNote').textContent =
    '服务器：' + (getServer() || '未设置（请先在登录页填写电脑局域网地址）');
}

function renderRecords() {
  dbAll().then(function (list) {
    var pending = list.filter(function (r) { return !r.synced; }).length;
    document.getElementById('pendingTip').textContent = '待同步：' + pending + ' 条';
    var box = document.getElementById('recList');
    if (!list.length) {
      box.innerHTML = '<p class="empty">暂无打卡记录</p>';
      return;
    }
    var html = '';
    list.forEach(function (r) {
      html += '<div class="rec">' +
        (r.image ? '<img src="' + r.image + '" alt="打卡图片">' : '<img src="icon.png" alt="无图" style="opacity:.4">') +
        '<div class="info">' +
          '<div class="time">' + r.time + '</div>' +
          (r.note ? '<div class="note">' + r.note + '</div>' : '') +
          '<div class="meta"><span class="st ' + (r.synced ? 'done' : 'wait') + '">' +
          (r.synced ? '已同步' : '待同步') + '</span></div>' +
        '</div>' +
        '<button type="button" class="btn-mini del" data-id="' + r.id + '">删除</button>' +
      '</div>';
    });
    box.innerHTML = html;
    /* 删除按钮事件 */
    Array.prototype.forEach.call(box.querySelectorAll('.btn-mini.del'), function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('确定删除这条打卡记录吗？')) return;
        dbDelete(btn.getAttribute('data-id')).then(function () { renderRecords(); });
      });
    });
  }).catch(function () {
    document.getElementById('recList').innerHTML = '<p class="empty">本地数据库不可用，无法读取记录</p>';
  });
}

/* 事件绑定 */
document.getElementById('checkinBtn').addEventListener('click', doCheckin);
document.getElementById('syncBtn').addEventListener('click', function () {
  showMsg('正在同步…');
  syncPending().then(function () { showMsg('同步完成', 'ok'); });
});
document.getElementById('logoutBtn').addEventListener('click', function () {
  if (!confirm('确定退出登录吗？')) return;
  localStorage.removeItem('pwa_user');
  window.location.href = 'login.html';        // 相对路径返回登录页
});

/* 网络恢复自动同步：online 事件 + 30 秒定时 */
window.addEventListener('online', function () { updateNetUI(); syncPending(); });
window.addEventListener('offline', function () { updateNetUI(); });
setInterval(function () { if (isOnline()) syncPending(); }, 30 * 1000);

/* 页面加载初始化：时钟 + 状态 + 记录 + 自动同步 */
document.getElementById('clock').textContent = nowStr();
setInterval(function () { document.getElementById('clock').textContent = nowStr(); }, 1000);
updateNetUI();
renderRecords();
syncPending();
</script>

<!-- PWA：注册 Service Worker（供 PWABuilder 检测与离线访问） -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js')
      .then(function (reg) { console.log('SW注册成功'); })
      .catch(function (err) { console.log('SW注册失败', err); });
  });
}
</script>
</body>
</html>
