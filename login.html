<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡系统 - 登录</title>
<meta name="theme-color" content="#1a2b5c">
<!-- PWA 清单：与 service-worker.js / icon.png 同目录，全部相对路径 -->
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   打卡系统 · 登录页 (login.html)
   - 登录账号校验走电脑后端接口：
     POST http://【电脑局域网IP】:8090/api/login
   - 登录成功后以相对路径跳转 user.html
   - 主题：深蓝主色调；页面顶部、底部为黑白横向条纹装饰
   - 所有资源相对路径，无外网链接
   ============================================================ */
:root{
  --blue-deep:#1a2b5c;   /* 主色：深蓝 */
  --blue-light:#2b4394;  /* 亮深蓝（hover） */
  --blue-dark:#0e1c3d;   /* 暗深蓝（背景） */
  --red:#d93025;         /* 错误提示 */
  --ok:#1e8e3e;          /* 成功提示 */
  --text:#1f2937;
  --muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue-deep) 55%,var(--blue-light) 100%);
  display:flex;align-items:center;justify-content:center;
  padding:56px 16px 80px;  /* 上下留白，避开黑白条纹 */
}
/* 顶部 / 底部 黑白横向条纹 */
.stripes{
  position:fixed;left:0;right:0;height:24px;z-index:1000;
  background:repeating-linear-gradient(to bottom,#000 0 12px,#fff 12px 24px);
}
.stripes.top{top:0}
.stripes.bottom{bottom:0}
/* 登录卡片 */
.card{
  width:100%;max-width:380px;
  background:rgba(255,255,255,.97);
  border-radius:16px;padding:28px 24px 22px;
  box-shadow:0 16px 48px rgba(0,0,0,.35);
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.brand img{width:44px;height:44px;border-radius:50%;border:2px solid var(--blue-deep)}
.brand h1{font-size:20px;color:var(--blue-deep);font-weight:700}
.sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--text);margin-bottom:5px}
.field label i{color:var(--red);font-style:normal}
.field input{
  width:100%;padding:10px 12px;font-size:14px;
  border:1px solid #d1d5db;border-radius:8px;
}
.field input:focus{outline:none;border-color:var(--blue-deep)}
.btn{
  width:100%;padding:11px;font-size:15px;font-weight:600;
  background:var(--blue-deep);color:#fff;border:none;border-radius:8px;
  cursor:pointer;margin-top:6px;
}
.btn:hover{background:var(--blue-light)}
.btn:disabled{background:#8fa3d8;cursor:not-allowed}
.msg{font-size:13px;margin-top:10px;min-height:18px;text-align:center}
.msg.err{color:var(--red)}
.msg.ok{color:var(--ok)}
.tip{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="stripes top"></div>
<div class="stripes bottom"></div>

<div class="card">
  <div class="brand">
    <img src="icon.png" alt="打卡系统图标">
    <h1>打卡系统</h1>
  </div>
  <p class="sub">登录账号由电脑后端验证，请先填写电脑局域网地址</p>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="server">电脑局域网地址<i> *</i></label>
      <input type="text" id="server" placeholder="http://192.168.1.100:8090" required>
    </div>
    <div class="field">
      <label for="username">账号<i> *</i></label>
      <input type="text" id="username" placeholder="请输入账号" required>
    </div>
    <div class="field">
      <label for="password">密码<i> *</i></label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">登 录</button>
  </form>

  <div class="msg" id="msg"></div>
  <p class="tip">说明：登录校验由电脑端 8090 服务完成；登录成功后自动进入打卡页。若后端地址填错或电脑服务未开启，将提示连接失败。</p>
</div>

<script>
/* ============================================================
   登录逻辑
   - 服务器地址保存在 localStorage（键 pwa_server），下次自动带出
   - 提交 POST {server}/api/login {username,password}
   - 成功：保存登录账号（键 pwa_user），相对路径跳转 user.html
   ============================================================ */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* 上次保存的服务器地址自动带出 */
  $('server').value = localStorage.getItem('pwa_server') || 'http://192.168.1.100:8090';

  function setMsg(text, cls) {
    var el = $('msg');
    el.textContent = text || '';
    el.className = 'msg ' + (cls || '');
  }

  /* 提交登录 */
  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var server = $('server').value.trim().replace(/\/+$/, '');   // 去掉结尾斜杠
    var username = $('username').value.trim();
    var password = $('password').value;

    if (!server || !username || !password) { setMsg('请填写完整的地址、账号和密码', 'err'); return; }
    if (!/^https?:\/\//i.test(server)) { setMsg('地址需以 http:// 或 https:// 开头', 'err'); return; }

    var btn = $('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中…';
    setMsg('正在连接 ' + server + ' …');

    /* 8 秒超时控制，避免断网时一直等待 */
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 8000);

    fetch(server + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password }),
      signal: ctrl.signal
    }).then(function (res) {
      clearTimeout(timer);
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok && data && data.ok === true, data: data };
      });
    }).then(function (r) {
      if (r.ok) {
        localStorage.setItem('pwa_server', server);      // 保存地址，打卡页共用
        localStorage.setItem('pwa_user', username);      // 保存登录账号
        setMsg('登录成功，正在进入…', 'ok');
        /* 登录成功后用相对路径跳转用户端 */
        window.location.href = 'user.html';
      } else {
        setMsg((r.data && r.data.message) || '登录失败：账号或密码错误', 'err');
      }
    }).catch(function (err) {
      clearTimeout(timer);
      setMsg('连接失败：' + err.message + '（请检查地址与电脑 8090 服务）', 'err');
    }).finally(function () {
      btn.disabled = false;
      btn.textContent = '登 录';
    });
  });
})();

/* PWA：注册 Service Worker（供 PWABuilder 检测与离线访问） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js')
      .then(function (reg) { console.log('SW注册成功'); })
      .catch(function (err) { console.log('SW注册失败', err); });
  });
}
</script>
</body>
</html>
