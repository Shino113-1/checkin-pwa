<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打卡系统 - 登录</title>
<meta name="theme-color" content="#1a2b5c">
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   打卡系统 · 登录页 (login.html)  v3
   v3 变更：登录输入框文字"账号"改为"囚号"
           （管理员仍使用 admin 账号登录，囚犯使用囚号登录）
   主题：深蓝色主色调；页面顶部、底部为黑白横向条纹装饰
   ============================================================ */
:root{
  --blue-deep:#0d2f6e;   /* 主色：深蓝 */
  --blue-light:#16418f;  /* 亮深蓝（hover） */
  --blue-dark:#081f4a;   /* 暗深蓝（背景） */
  --red:#d93025;         /* 错误提示 */
  --ok:#1e8e3e;          /* 成功提示 */
  --text:#1f2937;
  --muted:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,var(--blue-dark) 0%,var(--blue-deep) 55%,var(--blue-light) 100%);
  display:flex;align-items:center;justify-content:center;
  padding:56px 16px 80px;  /* 上下留白，避开黑白条纹装饰 */
}

/* ---- 顶部 / 底部 黑白横向条纹装饰（固定在页面上下两端） ---- */
.stripes{
  position:fixed;left:0;right:0;height:24px;z-index:1000;
  background:repeating-linear-gradient(to bottom,#000 0 12px,#fff 12px 24px);
}
.stripes.top{top:0}
.stripes.bottom{bottom:0}

/* ---- 登录卡片 ---- */
.card{
  width:100%;max-width:400px;background:#fff;border-radius:12px;
  padding:32px 28px;box-shadow:0 12px 40px rgba(0,0,0,.35);
}
/* 系统徽章标识 */
.badge-logo{
  width:76px;height:76px;border-radius:50%;display:block;
  margin:0 auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.card h1{font-size:24px;color:var(--blue-deep);text-align:center;margin-bottom:6px}
.card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:600}
.field input{
  width:100%;height:42px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;
  font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(13,47,110,.12)}
.btn{
  display:block;width:100%;height:44px;border:none;border-radius:8px;cursor:pointer;
  background:var(--blue-deep);color:#fff;font-size:15px;font-weight:600;
  transition:background .2s;
}
.btn:hover{background:var(--blue-light)}
.msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}
.msg.error{color:var(--red)}
.msg.ok{color:var(--ok)}
.tip{
  margin-top:16px;padding:10px 12px;background:#eef3fb;border-radius:8px;
  font-size:12px;color:var(--muted);line-height:1.9;
}
.tip code{background:#dfe8f6;padding:1px 6px;border-radius:4px;color:var(--blue-deep)}
</style>
</head>
<body>

<div class="stripes top"></div>
<div class="stripes bottom"></div>

<div class="card">
  <!-- 系统徽章（默认头像/机构标识） -->
  <img class="badge-logo" id="badgeLogo" alt="系统徽章">
  <h1>打卡系统</h1>
  <p class="sub">管理员使用账号，囚犯使用囚号登录</p>
  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label for="username">囚号</label>
      <input type="text" id="username" placeholder="囚犯请输入囚号（管理员请输入 admin）" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" placeholder="请输入密码" required>
    </div>
    <button type="submit" class="btn">登 录</button>
    <p id="msg" class="msg"></p>
  </form>
  <div class="tip">
    <strong>使用说明：</strong><br>
    1. 管理员初始账号 <code>admin</code>，密码 <code>admin</code>；<br>
    2. 囚犯账号（囚号）由管理员在管理后台创建，囚犯不能自行注册；<br>
    3. 登录后系统按角色自动跳转到用户端 / 管理端。
  </div>
</div>

<script>

                                 treatment, prisonArea, crime,
                                 avatar, createTime}]
                       其中 username 即【囚号】（囚犯的登录账号）；
                       role 取值：'admin' 管理员 / 'user' 囚犯
                       name 姓名 / treatment 待遇 / prisonArea 监区
                       crime 罪名 / avatar 头像(base64，可为空)
   - checkin_records : 打卡记录 [{id, username, image, lat, lng,
                                 address, time}]
                       image 为压缩后的 base64 图片
                       lat 纬度 / lng 经度 / address 详细中文地址
   - checkin_session : 当前登录会话 {username, role, loginTime}
   - checkin_cooldown_<囚号> : 打卡冷却截止时间戳（时间戳毫秒）

  /* ---------- 通用工具函数 ---------- */
  function getUsers() {
    try { return JSON.parse(localStorage.getItem(LS.users) || '[]'); }
    catch (e) { return []; }
  }
  function getSession() {
    try { return JSON.parse(localStorage.getItem(LS.session) || 'null'); }
    catch (e) { return null; }
  }
  function nowStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
           p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  /* 首次使用自动创建管理员账号 admin / admin（含升级后的新字段） */
  function ensureAdmin() {
    const users = getUsers();
    if (!users.some(u => u.username === 'admin')) {
      users.unshift({
        username: 'admin', password: 'admin', role: 'admin',
        name: '管理员', treatment: '', prisonArea: '', crime: '', avatar: '',
        createTime: nowStr()
      });
      localStorage.setItem(LS.users, JSON.stringify(users));
    }
  }
  function showMsg(text, isError) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (isError ? 'error' : 'ok');
  }
  /* 按角色跳转到对应页面 */
  function goHome(role) {
    window.location.replace(role === 'admin' ? 'admin.html' : 'user.html');
  }

  /* ---------- 初始化 ---------- */
  document.getElementById('badgeLogo').src = BADGE;
  ensureAdmin();

  // 若已经登录，则直接进入对应页面，避免重复登录
  const session = getSession();
  if (session && session.username) { goHome(session.role); return; }

  /* ---------- 登录逻辑（囚号 + 密码） ---------- */
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) { showMsg('请输入囚号/账号和密码', true); return; }

    const user = getUsers().find(u => u.username === username && u.password === password);
    if (!user) { showMsg('囚号/账号或密码错误', true); return; }

    // 写入登录会话并跳转
    localStorage.setItem(LS.session, JSON.stringify({
      username: user.username,
      role: user.role,
      loginTime: nowStr()
    }));
    goHome(user.role);
  });
})();
</script>

<!-- ============================================================
     使用步骤：
     1. 新建一个文件夹（例如 checkin_system），把 login.html、
        user.html、admin.html 三个文件放进同一个文件夹；
     2. 用 Chrome 或 Edge 浏览器打开 login.html；
     3. 首次打开会自动创建管理员账号 admin / admin；
     4. 用 admin 登录进入管理端，先创建囚犯账号
        （录入囚号、密码、姓名、待遇、监区、罪名、头像）；
     5. 囚犯用【囚号 + 密码】登录用户端：点击大红色【打卡】按钮
        自动定位并选图打卡，或切换到【囚犯信息】查看资料；
     6. 管理端可编辑囚犯资料、查看全部打卡记录并导出 Excel（含图片）。

     注意事项：
     - 所有数据保存在浏览器 LocalStorage 中，换浏览器或清理缓存会丢失；
     - Firefox 在 file:// 方式打开时三个页面的存储相互隔离（可能不同步），
       请改用本地服务器方式：在文件夹内运行
       python -m http.server 8080，然后访问 http://localhost:8080/login.html；
     - 定位功能需要浏览器授权位置权限；详细地址解析需要联网
       （优先 BigDataCloud、兜底 Nominatim，均免费无需Key）；
     - 导出 Excel 需要联网加载 xlsx.js CDN。
     ============================================================ -->

<!-- PWA：注册 Service Worker（供 PWABuilder 检测与离线缓存） -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('SW注册成功'))
      .catch(err => console.log('SW注册失败'));
  });
}
</script>
